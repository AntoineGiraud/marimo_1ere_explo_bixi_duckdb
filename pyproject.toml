[project]
name = "marimo-1ere-explo-duckdb"
version = "0.1.0"
description = "1ère explo pour découvrir DuckDB 🦆 à l'aide des données bixi 🚲 & Marimo"
readme = "README.md"
authors = [
    { name = "Antoine Giraud" }
]
requires-python = ">=3.13"

dependencies = [
    "marimo[sql]>=0.23.16",
    "folium>=0.20.0",
    "duckdb>=1.5.5",
    # "altair>=6.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "ty>=0.0.69",
]

[tool.ruff.format]
line-ending = "auto"
